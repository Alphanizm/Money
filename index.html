<script>
// ============================================
// KONFIGURASI GITHUB - GANTI DENGAN DATA ANDA!
// ============================================
const GITHUB_USER = 'Alphanizm';          // Ganti dengan username GitHub Anda
const GITHUB_REPO = 'Money';           // Nama repository
const GITHUB_TOKEN = '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';   // Personal Access Token (dari GitHub)

const GITHUB_API = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/data.json`;
// ============================================

const PASSWORD = 'alpha666';
let entries = [];
let currentUser = null;
let isSaving = false;

// DOM refs
const tbody = document.getElementById('entriesBody');
const actionsContainer = document.getElementById('actionsContainer');
const totalIncomeEl = document.getElementById('totalIncome');
const totalExpenseEl = document.getElementById('totalExpense');
const totalBalanceEl = document.getElementById('totalBalance');
const totalModalEl = document.getElementById('totalModal');
const currentDateEl = document.getElementById('currentDate');
const loginOverlay = document.getElementById('loginOverlay');
const passwordInput = document.getElementById('passwordInput');
const loginError = document.getElementById('loginError');
const loginBtn = document.getElementById('loginBtn');
const guestBtn = document.getElementById('guestBtn');
const roleBadge = document.getElementById('roleBadge');
const tableWrap = document.getElementById('tableWrap');
const statusBar = document.getElementById('statusBar');

function getToday() {
    return new Date().toISOString().split('T')[0];
}

function formatRupiah(amount) {
    return 'Rp ' + Number(amount).toLocaleString('id-ID');
}

function isAdmin() {
    return currentUser === 'admin';
}

function canEdit() {
    return isAdmin();
}

function escapeHtml(text) {
    if (!text) return '';
    return String(text).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function updateDate() {
    const now = new Date();
    currentDateEl.textContent = now.toLocaleDateString('id-ID', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    });
}

function setStatus(text, isError = false) {
    statusBar.textContent = text;
    statusBar.style.color = isError ? '#b13e3e' : '#4a6a8a';
}

// ========== GITHUB FUNCTIONS ==========

async function loadFromGitHub() {
    try {
        setStatus('⏳ Membaca data dari GitHub...');
        
        const response = await fetch(GITHUB_API);
        
        if (!response.ok) {
            if (response.status === 404) {
                setStatus('📝 File data belum ada, membuat baru...');
                const today = getToday();
                entries = [
                    { id: '1', desc: 'Gaji harian', income: 150000, expense: 0, modal: 0, date: today },
                    { id: '2', desc: 'Makan siang', income: 0, expense: 35000, modal: 0, date: today },
                    { id: '3', desc: 'Jasa desain', income: 75000, expense: 0, modal: 0, date: today },
                    { id: '4', desc: 'Transport', income: 0, expense: 20000, modal: 0, date: today },
                    { id: '5', desc: 'Snack', income: 0, expense: 12000, modal: 0, date: today },
                    { id: '6', desc: 'Modal awal', income: 0, expense: 0, modal: 500000, date: today }
                ];
                await saveToGitHub();
                render();
                setStatus('✅ Data baru dibuat!');
                return;
            }
            throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        const content = atob(data.content);
        entries = JSON.parse(content);
        
        for (const e of entries) {
            if (e.modal === undefined) e.modal = 0;
            if (!e.date) e.date = getToday();
        }
        
        setStatus(`✅ Data dimuat (${entries.length} entri)`);
        render();
        
    } catch (error) {
        console.error('Load error:', error);
        setStatus('❌ Gagal memuat data! Cek koneksi & token.', true);
        const today = getToday();
        entries = [
            { id: '1', desc: 'Gaji harian', income: 150000, expense: 0, modal: 0, date: today },
            { id: '2', desc: 'Makan siang', income: 0, expense: 35000, modal: 0, date: today },
            { id: '3', desc: 'Jasa desain', income: 75000, expense: 0, modal: 0, date: today },
            { id: '4', desc: 'Transport', income: 0, expense: 20000, modal: 0, date: today },
            { id: '5', desc: 'Snack', income: 0, expense: 12000, modal: 0, date: today },
            { id: '6', desc: 'Modal awal', income: 0, expense: 0, modal: 500000, date: today }
        ];
        render();
    }
}

async function saveToGitHub() {
    if (isSaving) return;
    isSaving = true;
    
    try {
        setStatus('⏳ Menyimpan ke GitHub...');
        
        const getRes = await fetch(GITHUB_API);
        let sha = null;
        
        if (getRes.ok) {
            const getData = await getRes.json();
            sha = getData.sha;
        }
        
        const jsonString = JSON.stringify(entries, null, 2);
        const content = btoa(unescape(encodeURIComponent(jsonString)));
        
        const body = {
            message: `Update data ${new Date().toLocaleString('id-ID')}`,
            content: content
        };
        
        if (sha) {
            body.sha = sha;
        }
        
        const response = await fetch(GITHUB_API, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${GITHUB_TOKEN}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });
        
        if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.message || `HTTP ${response.status}`);
        }
        
        setStatus(`✅ Data tersimpan! (${entries.length} entri)`);
        
    } catch (error) {
        console.error('Save error:', error);
        setStatus(`❌ Gagal simpan: ${error.message}`, true);
        alert(`Gagal menyimpan data!\n\nError: ${error.message}\n\nPastikan:\n1. Token GitHub benar\n2. Repository public\n3. Koneksi internet stabil`);
    } finally {
        isSaving = false;
    }
}

// ========== RENDER FUNCTIONS ==========

function calculateTotals() {
    let ti = 0, te = 0, mm = 0;
    for (const e of entries) {
        ti += Number(e.income) || 0;
        te += Number(e.expense) || 0;
        mm += Number(e.modal) || 0;
    }
    return { totalIncome: ti, totalExpense: te, manualModal: mm };
}

function updateSummary(ti, te, tm) {
    const balance = ti - te;
    totalIncomeEl.textContent = formatRupiah(ti);
    totalExpenseEl.textContent = formatRupiah(te);
    totalBalanceEl.textContent = formatRupiah(balance);
    totalModalEl.textContent = formatRupiah(tm || 0);
}

function applyEditability() {
    const editable = canEdit();
    document.querySelectorAll('#entriesBody input.edit-input').forEach(inp => {
        inp.disabled = !editable;
        inp.style.pointerEvents = editable ? 'auto' : 'none';
    });
    document.querySelectorAll('#entriesBody button[data-action="deleteRow"]').forEach(btn => btn.disabled = !editable);
    roleBadge.className = 'login-badge ' + (isAdmin() ? 'admin' : 'guest');
    roleBadge.innerHTML = isAdmin() ? '👑 Admin' : '👤 Tamu';
}

function renderActions() {
    if (canEdit()) {
        actionsContainer.innerHTML = `
            <div class="btn-group">
                <button class="btn btn-primary" id="addRowBtn">+ Tambah</button>
                <button class="btn btn-outline" id="logoutBtnAction" style="border-color:#b3cbe0;">🚪 Keluar</button>
            </div>
        `;
        document.getElementById('addRowBtn').onclick = addNewRow;
        document.getElementById('logoutBtnAction').onclick = logout;
    } else {
        actionsContainer.innerHTML = `
            <button class="btn-logout-big" id="logoutBtnBig">
                <span class="icon">🚪</span> Keluar
            </button>
        `;
        document.getElementById('logoutBtnBig').onclick = logout;
    }
}

function render() {
    const editable = canEdit();
    const { totalIncome, totalExpense, manualModal } = calculateTotals();
    const selisih = totalIncome - totalExpense;
    const totalModal = manualModal + selisih;

    if (editable) {
        tableWrap.classList.remove('hide-delete-col');
    } else {
        tableWrap.classList.add('hide-delete-col');
    }

    if (entries.length === 0) {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="${editable ? 6 : 5}">Belum ada catatan.</td></tr>`;
        updateSummary(totalIncome, totalExpense, totalModal);
        applyEditability();
        renderActions();
        return;
    }

    let html = '';
    for (const entry of entries) {
        const iv = Number(entry.income) || 0;
        const ev = Number(entry.expense) || 0;
        const mv = Number(entry.modal) || 0;
        const dv = entry.date || getToday();
        html += `
            <tr data-id="${entry.id}">
                <td><input type="text" class="edit-input" style="min-width:50px" value="${escapeHtml(entry.desc || '')}" data-field="desc" placeholder="Ket." ${editable ? '' : 'disabled'} /></td>
                <td class="date-col"><input type="date" class="edit-input date-input" value="${dv}" data-field="date" ${editable ? '' : 'disabled'} /></td>
                <td><input type="number" min="0" step="1" class="edit-input income-input" value="${iv}" data-field="income" placeholder="0" ${editable ? '' : 'disabled'} /></td>
                <td><input type="number" min="0" step="1" class="edit-input expense-input" value="${ev}" data-field="expense" placeholder="0" ${editable ? '' : 'disabled'} /></td>
                <td><input type="number" min="0" step="1" class="edit-input modal-input" value="${mv}" data-field="modal" placeholder="0" ${editable ? '' : 'disabled'} /></td>
                <td style="text-align:center" class="delete-col"><button class="btn btn-outline btn-danger-outline" style="padding:.1rem .4rem;font-size:.6rem" data-action="deleteRow" data-id="${entry.id}" ${editable ? '' : 'disabled'}>✕</button></td>
            </tr>
        `;
    }
    tbody.innerHTML = html;
    updateSummary(totalIncome, totalExpense, totalModal);
    applyEditability();
    renderActions();
}

// ========== CRUD FUNCTIONS ==========

function handleInputChange(e) {
    if (!canEdit()) {
        e.preventDefault();
        return;
    }
    const target = e.target;
    if (!target.classList.contains('edit-input')) return;
    const row = target.closest('tr');
    if (!row) return;
    const id = row.dataset.id;
    if (!id) return;
    const field = target.dataset.field;
    if (!field) return;
    const idx = entries.findIndex(e => e.id === id);
    if (idx === -1) return;
    let val = target.value;
    if (['income', 'expense', 'modal'].includes(field)) {
        const num = parseFloat(val);
        val = isNaN(num) || num < 0 ? 0 : Math.round(num);
        if (target.value !== String(val)) target.value = val;
        entries[idx][field] = val;
    } else if (field === 'desc' || field === 'date') {
        entries[idx][field] = val;
    }
    const { totalIncome, totalExpense, manualModal } = calculateTotals();
    const selisih = totalIncome - totalExpense;
    updateSummary(totalIncome, totalExpense, manualModal + selisih);
    saveToGitHub();
}

function handleDeleteClick(e) {
    if (!canEdit()) {
        e.preventDefault();
        return;
    }
    const target = e.target.closest('button[data-action="deleteRow"]');
    if (!target || target.disabled) return;
    const id = target.dataset.id;
    if (!id) return;
    if (!confirm('Hapus baris ini?')) return;
    entries = entries.filter(e => e.id !== id);
    render();
    saveToGitHub();
}

function addNewRow() {
    if (!canEdit()) return;
    entries.push({
        id: 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
        desc: '',
        income: 0,
        expense: 0,
        modal: 0,
        date: getToday()
    });
    render();
    saveToGitHub();
    setTimeout(() => {
        const rows = tbody.querySelectorAll('tr');
        if (rows.length) {
            const inp = rows[rows.length - 1].querySelector('input[data-field="desc"]');
            if (inp && canEdit()) inp.focus();
        }
    }, 50);
}

// ========== LOGIN FUNCTIONS ==========

function login() {
    const pwd = passwordInput.value.trim();
    if (!pwd) {
        loginError.textContent = '❌ Masukkan kata sandi.';
        return;
    }
    if (pwd === PASSWORD) {
        currentUser = 'admin';
        loginOverlay.style.display = 'none';
        loginError.textContent = '';
        passwordInput.value = '';
        sessionStorage.setItem('currentUser', 'admin');
        render();
    } else {
        loginError.textContent = '❌ Kata sandi salah. Coba lagi.';
        passwordInput.value = '';
        passwordInput.focus();
    }
}

function logout() {
    currentUser = null;
    sessionStorage.removeItem('currentUser');
    render();
    loginOverlay.style.display = 'flex';
    passwordInput.focus();
}

function guestLogin() {
    currentUser = null;
    loginOverlay.style.display = 'none';
    sessionStorage.removeItem('currentUser');
    render();
}

// ========== INIT ==========

function init() {
    updateDate();
    setInterval(updateDate, 60000);

    const savedUser = sessionStorage.getItem('currentUser');
    if (savedUser === 'admin') {
        currentUser = 'admin';
        loginOverlay.style.display = 'none';
    } else {
        currentUser = null;
        loginOverlay.style.display = 'flex';
    }

    loadFromGitHub();

    tbody.addEventListener('input', handleInputChange);
    tbody.addEventListener('click', handleDeleteClick);

    loginBtn.onclick = function(e) {
        e.preventDefault();
        login();
    };

    guestBtn.onclick = function(e) {
        e.preventDefault();
        guestLogin();
    };

    passwordInput.onkeydown = function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            login();
        }
    };
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>
</body>
</html>
